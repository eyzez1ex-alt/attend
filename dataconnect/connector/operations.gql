mutation CreateVacationRequest($vacationType: VacationType!, $startDate: Date!, $endDate: Date!, $requestNote: String) @auth(expr: "auth.uid != nil && auth.token.email_verified && vars.startDate <= vars.endDate") {
  vacation_insert(data: {
    employeeFirebaseUid_expr: "auth.uid"
    vacationType: $vacationType
    startDate: $startDate
    endDate: $endDate
    requestNote: $requestNote
  })
}

mutation ApproveVacation($id: UUID!, $decisionNote: String) @auth(expr: "auth.token.email_verified && (auth.token.email == 'yusufgibrel3@gmail.com' || auth.token.role == 'moderator' || auth.token.role == 'admin' || auth.token.moderator == true || auth.token.admin == true)") @transaction {
  vacation_update(id: $id, data: {
    status: APPROVED
    decisionNote: $decisionNote
    reviewedByUid_expr: "auth.uid"
    reviewedAt_expr: "request.time"
  })
  adminLog_insert(data: {
    actorUid_expr: "auth.uid"
    action: "VACATION_APPROVED"
    newValue: $decisionNote
  })
}

mutation RejectVacation($id: UUID!, $decisionNote: String) @auth(expr: "auth.token.email_verified && (auth.token.email == 'yusufgibrel3@gmail.com' || auth.token.role == 'moderator' || auth.token.role == 'admin' || auth.token.moderator == true || auth.token.admin == true)") @transaction {
