# SQL Connect uses these operation-level authorization rules instead of Firestore rules.
# Manager access requires a verified owner email or a verified moderator/admin claim.

query GetMyEmployeeProfile @auth(level: USER_EMAIL_VERIFIED) {
  employees(where: { firebaseUid: { eq_expr: "auth.uid" } }, limit: 1) {
    firebaseUid
    employeeCode
    fullName
    email
    department
    isActive
  }
}

query GetMyAttendance @auth(level: USER_EMAIL_VERIFIED) {
  attendances(
    where: { employeeFirebaseUid: { eq_expr: "auth.uid" } }
    orderBy: { workDate: DESC }
    limit: 500
  ) {
    employeeFirebaseUid
    employee { employeeCode fullName }
    workDate
    checkInAt
    checkOutAt
    checkInLatitude
    checkInLongitude
    checkOutLatitude
    checkOutLongitude
    status
    locationCheckStatus
  }
}

query GetMyVacations @auth(level: USER_EMAIL_VERIFIED) {
  vacations(
    where: { employeeFirebaseUid: { eq_expr: "auth.uid" } }
    orderBy: { createdAt: DESC }
    limit: 200
  ) {
    id
    employee { employeeCode fullName }
    vacationType
    startDate
    endDate
    totalWorkingDays
    status
    requestNote
    decisionNote
    createdAt
  }
}

query ListEmployees @auth(expr: "auth.token.email_verified && (auth.token.email == 'yusufgibrel3@gmail.com' || auth.token.role == 'moderator' || auth.token.role == 'admin' || auth.token.moderator == true || auth.token.admin == true)") {
  employees(orderBy: { fullName: ASC }, limit: 500) {
    firebaseUid
    employeeCode
    fullName
    email
    department
    isActive
    createdAt
  }
}

query ListAttendanceByRange($fromDate: Date!, $toDate: Date!) @auth(expr: "auth.token.email_verified && (auth.token.email == 'yusufgibrel3@gmail.com' || auth.token.role == 'moderator' || auth.token.role == 'admin' || auth.token.moderator == true || auth.token.admin == true)") {
  attendances(
    where: { workDate: { ge: $fromDate, le: $toDate } }
    orderBy: { workDate: DESC }
    limit: 2000
  ) {
    employeeFirebaseUid
    employee { employeeCode fullName }
    workDate
    checkInAt
    checkOutAt
    status
    locationCheckStatus
    administratorNote
  }
}

