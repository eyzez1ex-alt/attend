query ListAdminLogs @auth(expr: "auth.token.email_verified && (auth.token.email == 'yusufgibrel3@gmail.com' || auth.token.role == 'moderator' || auth.token.role == 'admin' || auth.token.moderator == true || auth.token.admin == true)") {
