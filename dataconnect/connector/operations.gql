mutation SaveWorkLocation($locationName: String!, $latitude: Float!, $longitude: Float!) @auth(expr: "auth.token.email_verified && (auth.token.email == 'yusufgibrel3@gmail.com' || auth.token.role == 'moderator' || auth.token.role == 'admin' || auth.token.moderator == true || auth.token.admin == true)") @transaction {
  workLocation_upsert(data: {
    locationKey: "primary"
    locationName: $locationName
    latitude: $latitude
    longitude: $longitude
    radiusMeters: 600
    isActive: true
    updatedByUid_expr: "auth.uid"
    updatedAt_expr: "request.time"
  })
  adminLog_insert(data: {
    actorUid_expr: "auth.uid"
    action: "WORK_LOCATION_UPDATED"
    newValue: $locationName
  })
}
