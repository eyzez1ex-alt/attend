mutation CreateAdminVacationRequest($employeeUid: String!, $vacationType: VacationType!, $startDate: Date!, $endDate: Date!, $requestNote: String) @auth(expr: "auth.token.email_verified && vars.startDate <= vars.endDate && (auth.token.email == 'yusufgibrel3@gmail.com' || auth.token.role == 'moderator' || auth.token.role == 'admin' || auth.token.moderator == true || auth.token.admin == true)") @transaction {
  vacation_insert(data: {
    employeeFirebaseUid: $employeeUid
    vacationType: $vacationType
    startDate: $startDate
    endDate: $endDate
    requestNote: $requestNote
  })
  adminLog_insert(data: {
    actorUid_expr: "auth.uid"
    action: "VACATION_CREATED_BY_ADMIN"
    newValue: $requestNote
  })
}

mutation UpdateVacationRequest($id: UUID!, $vacationType: VacationType!, $startDate: Date!, $endDate: Date!, $requestNote: String) @auth(expr: "auth.token.email_verified && vars.startDate <= vars.endDate && (auth.token.email == 'yusufgibrel3@gmail.com' || auth.token.role == 'moderator' || auth.token.role == 'admin' || auth.token.moderator == true || auth.token.admin == true)") @transaction {
